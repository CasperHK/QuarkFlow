# === QuarkFlow Inertia Configuration ===
quarkflow.inertia.version=1

# === Vite Dev Server ===
quarkflow.vite.dev=true
quarkflow.vite.dev-server=http://localhost:5173

# === CORS (allow Vite dev server in dev mode) ===
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=X-Inertia,X-Inertia-Version,X-Requested-With,Content-Type,Accept
quarkus.http.cors.exposed-headers=X-Inertia
